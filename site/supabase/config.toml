# Sales project: leads from the website. NOT the product's Supabase project.
# Link it with its own ref:  npx supabase link --project-ref <sales-ref>
project_id = "demo-stays-sales"

[functions.leads]
# Called by the public website with the publishable key.
verify_jwt = false

[functions.device-session]
# Called by the admin panel with the user's session; it checks the JWT itself
# (getUser) to read its session id.
verify_jwt = false

[functions.verifactu-dispatch]
# Called by the database (cron key) or with the service key; checks it itself.
verify_jwt = false
