name: Operations alerts

# Every hour: stuck or failing sending queues (SES.HOSPEDAJES, VERI*FACTU,
# guest emails, channels) and the AI failing too often, across every hotel
# (ops_alerts). Opens the "Alertas de operación" issue (GitHub notifies whoever
# watches the repo), comments on it only when the set of alerts changes, and
# closes it when everything is back to normal. Can also be run by hand.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: ops-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check every hotel
        id: check
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          node scripts/ops-alerts.mjs --out report.md | tee out.txt
          grep -E '^(alerts|signature)=' out.txt >> "$GITHUB_OUTPUT"
      - name: Open, update or close the issue
        env:
          GH_TOKEN: ${{ github.token }}
          ALERTS: ${{ steps.check.outputs.alerts }}
          SIGNATURE: ${{ steps.check.outputs.signature }}
        run: |
          title="Alertas de operación"
          number=$(gh issue list --state open --limit 50 --json number,title \
            -q ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ "$ALERTS" != "0" ]; then
            if [ -z "$number" ]; then
              gh issue create --title "$title" --body-file report.md
            else
              last=$(gh issue view "$number" --json body,comments -q '(.comments | last | .body) // .body')
              if ! printf '%s' "$last" | grep -q "ops-alerts:$SIGNATURE"; then
                gh issue comment "$number" --body-file report.md
              fi
            fi
          elif [ -n "$number" ]; then
            gh issue close "$number" --comment "Resuelto: la última comprobación no encuentra alertas."
          fi
