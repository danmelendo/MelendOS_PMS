name: Data lake export

# Daily Parquet export of every hotel to the private `lake` bucket
# (see lake/README.md). Can also be run by hand from the Actions tab.
# Runs for the demo (repository secrets) and, once its secrets exist, for
# production (PROD_SUPABASE_DB_URL, PROD_SUPABASE_URL, PROD_SUPABASE_SECRET_KEY).
on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Export day (yyyy-mm-dd, default today)"
        required: false

concurrency:
  group: lake-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        target: [demo, production]
    env:
      SUPABASE_DB_URL: ${{ matrix.target == 'production' && secrets.PROD_SUPABASE_DB_URL || secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ matrix.target == 'production' && secrets.PROD_SUPABASE_URL || secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ matrix.target == 'production' && secrets.PROD_SUPABASE_SECRET_KEY || secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Nothing to export yet
        if: env.SUPABASE_DB_URL == ''
        run: echo "No secrets for ${{ matrix.target }} yet."
      - uses: actions/checkout@v4
        if: env.SUPABASE_DB_URL != ''
      - uses: actions/setup-python@v5
        if: env.SUPABASE_DB_URL != ''
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lake/requirements.txt
      - run: pip install -r lake/requirements.txt
        if: env.SUPABASE_DB_URL != ''
      - name: Export
        if: env.SUPABASE_DB_URL != ''
        env:
          EXPORT_DATE: ${{ inputs.date }}
        run: python lake/export.py ${EXPORT_DATE:+--date "$EXPORT_DATE"}
