name: Data lake export

# Daily Parquet export of every hotel to the private `lake` bucket
# (see lake/README.md). Can also be run by hand from the Actions tab.
on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Export day (yyyy-mm-dd, default today)"
        required: false

concurrency:
  group: lake-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lake/requirements.txt
      - run: pip install -r lake/requirements.txt
      - name: Export
        env:
          EXPORT_DATE: ${{ inputs.date }}
        run: python lake/export.py ${EXPORT_DATE:+--date "$EXPORT_DATE"}
